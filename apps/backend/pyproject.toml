[project]
name = "timetrack-backend"
version = "0.1.0"
description = "TimeTrack 后端服务 - FastAPI + SQLAlchemy + SQLite"
authors = [{ name = "TimeTrack Team" }]
# uv 会读取 .python-version 文件，但这里也要写明允许的版本范围
# 锁定的具体版本：3.11（见 .python-version）
requires-python = ">=3.11,<3.15"

# 一期最简依赖：FastAPI + SQLAlchemy 2.0 + SQLite
# 后续按需加：Pydantic Settings / Alembic / Loguru / httpx / 等等
dependencies = [
    "fastapi>=0.115.0,<0.120.0",           # Web 框架
    "uvicorn[standard]>=0.32.0,<0.36.0",   # ASGI 服务器
    "pydantic>=2.9.0,<3.0.0",              # 数据校验
    "pydantic-settings>=2.6.0,<3.0.0",     # 配置管理
    "sqlalchemy>=2.0.36,<2.1.0",           # ORM
    "python-multipart>=0.0.12",            # 文件上传支持（后续报表导出用）
    "python-dateutil>=2.9.0",              # 日期解析
]

[project.optional-dependencies]
# 一期只用 dev 依赖：测试、代码检查
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",                       # 测试 FastAPI 用
    "black>=24.0.0",
    "ruff>=0.7.0",
]

[project.scripts]
# 让 `timetrack-backend` 命令直接启动服务（生产部署用）
timetrack-backend = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# 一期最简规则集
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]  # 行长度由 formatter 控制

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# ===== 开发依赖分组（PEP 735 格式，替代旧的 [tool.uv] dev-dependencies） =====
[dependency-groups]
# 用 `uv sync --group dev` 安装
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",                       # 测试 FastAPI 用
    "black>=24.0.0",
    "ruff>=0.7.0",
]
